<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form 3</title>
</head>
<body>
    <form action="">
    <div>
        <hr>
        <label>Student Registration form</label>
        <hr>    
    </div>

    <div>
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" placeholder="Enter full name" name="Full Name">
    </div>

    <br> <br>

    <div>
        <label for="Uemail">Email</label>
        <input type="email" id="Uemail" placeholder="Enter email" name="Email">

    </div>
    <br> <br>

    <div>
        <label for="pass">Password</label>
        <input type="password" id="pass" name="Password" placeholder="Enter a Password">

    </div>
    <br> <br>

    <div>
        <label for="age">Age</label>
        <input type="number" id="age" name="Age" placeholder="Enter an age">
    </div>

    <br> <br>

    <div>
        <label for="dob">Date Of Birth</label>
        <input type="date" id="dob" name="DOB" min="2000-01-01"
       max="2010-12-31">   <!--how to take min date and max date interval-->

    </div>
    <br><br>

    <div>
        <label>Gender</label>
        <br>

        <label for="male">Male</label>
        <input type="radio" id="male" name="Gender" value="male">

        <label for="female">Female</label>
        <input type="radio" id="female" name="Gender" value="female">

        <label for="other">Other</label>
        <input type="radio" id="other" name="Gender" value="other">

    </div>
    <br>

    <div>
        <label>Course</label>
        <br><br>

        <select name="Course" id="1">
            <option value="aiml">AIML</option>
            <option value="ai">AI</option>
            <option value="cse">CSE</option>
        </select>
    </div>
    <br>
    <!-- <div>
        <label>Skills</label>

        <ul type="square">
            <li>HTML</li>
            <li>CSS</li>
            <li>JAVA</li>
            <li>PYTHON</li>
        </ul>
    </div> -->

    <label>Skills</label>
    <br><br>
    <input type="checkbox" id="html" name="Skill" value="HTML">
    <label for="html">HTML</label>
    <br>
    <input type="checkbox" id="css" name="Skill" value="CSS">
    <label for="css">CSS</label>
    
    <br>
    <input type="checkbox" id="java" name="Skill" value="JAVA">
    <label for="java">JAVA</label>
    
    <br>
    <input type="checkbox" id="python" name="Skill" value="PYTHON">
    <label for="python">PYTHON</label>
    
    <br>
    <br>
    <div>
        <label for="phone">Phone Number</label>
        <input type="tel" value="+91 " name="Phone" id="phone">
    </div>
<br>
    <div>
        <label for="address">Address</label>
        <Address>
            <textarea name="address" id="address" rows="4" cols="6" placeholder="Enter address here">

            </textarea>
        </Address>
        
    </div>
    <br><br>
    <div>
        <label for="upload photo">Upload photo</label>
        <br><br>
        <input type="file" accept=".pdf" id="upload photo">
    </div>
    <br><br>
    <div>
        <label for="website">Website</label>
        <br>
        <input type="url" id="website" name="Website">
    </div>
    <br> <br>
    <div>
        <label for="search">Search</label>
        <input type="search" id="search"  name="Search">
    </div>
    <br>
    <div>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </div>
    </form>
</body>
</html>
