<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registrtaation Form</title>
</head>
<body>
    <form action="">
        <h3>Name</h3>
        <input type="text" name="name" id="name" placeholder="Enter your name" required>

        <h3>Email</h3>
        <input type="email" name="email" id="email" placeholder="Enter your email">

        <h3>Password</h3>
        <input type="password" name="password" id="password" placeholder="Enter your Password">

        <h3>Gender</h3>

        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>

        <h3>Course</h3>
        <input type="text" name="course" id="course" placeholder="select the course">
        <br> <br>

        <input type="checkbox" name="terms" id="terms">
        <label for="terms" > <b>I accepts the terms and conditions</b></label>
        

        <br> <br>

        <button type="submit" style="background-color:brown">Submit</button>
    </form>
</body>
</html>
